<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="icon" href="./imgs/pokeball.png" type="img.png">

    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/font.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/assets.css">
</head>

<body onload="fetchData(limit, offset)">
    <header>
        <div class="max-content-width">
            <h1><img class="pokeball" src="./imgs/pokeball.png" alt="Pokeball"> Pokedex</h1>
            <div class="search-input">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="search" data-id="search-input" aria-label="Search Pokemon by name">
                    <button class="search-button" id="search-button" data-id="search-button" aria-label="Start search" onclick="search(document.getElementById('search-input').value)">Search</button>
                </div>
                <h6 class="warning hidden" id="warning">Please enter at least 3 letters!</h6>
            </div>
        </div>
    </header>

    <main data-id="content">
        <div class="loading-screen" id="loading-screen">
            <img src="./imgs/giphy.webp" alt="loading Pokemon">
        </div>

        <div class="max-content-width card-section" id="card-section">
            <!-- hier werden die karten per js eingefügt -->
        </div>

        <dialog class="pokemon-dialog" id="pokemon-dialog" data-id="dialog" aria-label="Pokemon details" onclick="closeDialogOnBackdropClick(event)" onclose="document.body.style.overflow = ''">
            <!-- hier kommen die infos des pokemons -->

        </dialog>
        <button data-id="load-more-button" class="load-more-btn" aria-label="Load more Pokemon" onclick="loadMorePokemon()">Load More</button>
    </main>


    <footer class="center">
        <div class="max-content-width" >
            <span>Copyright © 2026 Samuel W</span>
            <a href="./Impressum.html">Impressum</a>
        </div>
    </footer>

    <script src="./script/templates.js"></script>
    <script src="./script/script.js"></script>
    <script src="script/search.js"></script>
</body>

</html>
